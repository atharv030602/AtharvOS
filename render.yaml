# Render Blueprint — free static site (served from a CDN, never sleeps).
# Render dashboard → New → Static Site → pick this repo; these settings
# are picked up automatically. Manual equivalent:
#   Build command:     npm ci && npm run build
#   Publish directory: dist
services:
  - type: web
    name: atharv-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
